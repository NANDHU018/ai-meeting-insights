<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Meeting Assistant — Forgot Password." />
    <title>AI Meeting Assistant — Forgot Password</title>
    <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div class="auth-container card" style="width: 100%; max-width: 400px; padding: 40px;">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 2rem; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; color: transparent;">Reset Password</h1>
        <p style="color: var(--text-muted); margin-top: 8px;">Enter your email to receive a reset link</p>
    </div>

    <form id="forgotPasswordForm" onsubmit="event.preventDefault(); handleForgotPassword();" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
            <label for="email" style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-secondary);">Email</label>
            <input type="email" id="email" class="form-control" required placeholder="you@example.com" style="width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: var(--radius-sm); color: white; transition: var(--transition);" onfocus="this.style.borderColor='var(--accent-primary)'" onblur="this.style.borderColor='var(--border)'" />
        </div>
        <button type="submit" id="forgotPasswordSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Send Reset Link</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Remembered your password? <a href="login.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Log In</a>
    </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="script.js?v=9"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
