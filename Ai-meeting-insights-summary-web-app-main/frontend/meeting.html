<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Meeting Assistant — View transcript, summary, and chat with AI about your meeting." />
    <title>AI Meeting Assistant — Details</title>
    <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>

<div class="bg-gradient"></div>

<!-- Navbar -->
<nav class="navbar">
    <a class="navbar-brand" href="index.html">
        <div class="logo-icon">M</div>
        <span>MeetAI</span>
    </a>
    <div class="navbar-links">
        <a href="index.html">← Back to Dashboard</a>
    </div>
</nav>

<!-- Main Content -->
<div class="container">

    <div class="meeting-layout">
        <!-- LEFT COLUMN: Content -->
        <div>
            <!-- Header -->
            <div class="meeting-detail-header" id="meetingHeader">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                    <h1 id="meetingTitle" style="margin-bottom: 0;">Loading…</h1>
                    <button class="btn btn-sm" id="editTitleBtn" title="Edit Title" style="background: transparent; border: none; padding: 4px; color: var(--text-muted); cursor: pointer; display: none;">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                    <input type="text" id="editTitleInput" class="form-control hidden" style="font-size: 1.5rem; font-weight: 700; flex: 1; min-width: 200px; margin-bottom: 0;" />
                    <button class="btn btn-sm btn-primary hidden" id="saveTitleBtn">Save</button>
                    <button class="btn btn-sm hidden" id="cancelTitleBtn">Cancel</button>
                </div>
                <div class="meta" id="meetingDate" style="margin-top: 5px;"></div>
            </div>

            <!-- Summarize Button -->
            <div class="mb-4" id="summarizeSection">
                <button class="btn btn-primary" id="summarizeBtn">✨ Generate AI Summary</button>
            </div>

            <!-- Summary Block -->
            <div class="card content-box">
                <h2><span class="dot green"></span> AI Summary</h2>
                <div class="summary-text" id="summaryText">
                    <span style="color:var(--text-muted);">Click "Generate AI Summary" above to create one.</span>
                </div>
            </div>

            <!-- Transcript Block -->
            <div class="card content-box">
                <h2><span class="dot"></span> Transcript</h2>
                <div class="transcript-text" id="transcriptText">
                    <span style="color:var(--text-muted);">No transcript available.</span>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: AI Chat -->
        <div class="ai-chat-wrapper">
            <div class="card ai-chat-card">
                <h2>
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Ask AI Assistant
                </h2>
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-bubble ai">Hi! Ask me anything about this meeting's transcript or topics.</div>
                </div>
                <div class="chat-input-row">
                    <input type="text" placeholder="Message AI…" id="chatInput" autocomplete="off" />
                    <button class="btn btn-primary btn-sm" id="askBtn" style="padding: 0 16px;">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="script.js?v=9"></script>
</body>
</html>
