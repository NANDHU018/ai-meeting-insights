<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Meeting Assistant — Log in to your account." />
    <title>AI Meeting Assistant — Login</title>
    <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div class="auth-container card" style="width: 100%; max-width: 400px; padding: 40px;">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 2rem; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; color: transparent;">Welcome Back</h1>
        <p style="color: var(--text-muted); margin-top: 8px;">Log in to access your meetings</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
            <label for="email" style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-secondary);">Email</label>
            <input type="email" id="email" class="form-control" required placeholder="you@example.com" style="width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: var(--radius-sm); color: white; transition: var(--transition);" onfocus="this.style.borderColor='var(--accent-primary)'" onblur="this.style.borderColor='var(--border)'" />
        </div>
        <div class="form-group">
            <label for="password" style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-secondary);">Password</label>
            <div class="password-wrapper" style="position: relative;">
                <input type="password" id="password" class="form-control" required style="width: 100%; padding: 12px 16px; padding-right: 48px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: var(--radius-sm); color: white; transition: var(--transition);" onfocus="this.style.borderColor='var(--accent-primary)'" onblur="this.style.borderColor='var(--border)'" />
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" class="eye-icon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            <div style="text-align: right; margin-top: 8px;">
                <a href="forgot-password.html" style="color: var(--accent-primary); font-size: 0.85rem; text-decoration: none; font-weight: 500;">Forgot Password?</a>
            </div>
        </div>
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Log In</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Sign up</a>
    </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="script.js?v=9"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
